spec_version: "0.1.0"
name: vox-build
version: 3.0.0
description: >
  Voice-driven website builder. Vox, a voice agent on Agora Conversational AI
  with Murf Falcon TTS, plans a site with the user, builds it as a React
  project after approval, routes each edit to a tiered sub-agent
  (jnr-developer, snr-developer, architect) to balance latency and LLM cost,
  validates every version by compiling it, and publishes to GitHub Pages
  after an explicit yes.

model:
  preferred: "anthropic:claude-sonnet-5-5"
  fallback: ["openai:gpt-4.1", "google:gemini-2.5-pro"]

tools: [file-read, file-write]

skills: [route-intent, apply-edit]

voice:
  platform: agora-conversational-ai
  tts: murf-falcon
  prompt: agents/vox/SOUL.md
  llm_endpoint: /llm/{project_id}/chat/completions
  tools: [plan_site, build_site, edit_site, undo_change, describe_site, check_progress, publish_site, publication_status]

sub_agents:
  - name: vox
    path: agents/vox
    description: >
      The voice agent the user talks to; calls the tools above.
  - name: code-editor
    path: agents/code-editor
    description: >
      Edit orchestrator. Delegates to jnr-developer, snr-developer,
      or architect based on intent-router tier assignment.
    sub_agents: [jnr-developer, snr-developer, architect]

delegation:
  mode: auto
