spec_version: "0.1.0"
name: vox-build
version: 2.0.0
description: >
  Voice-driven website generator. Vox, a voice agent on Agora Conversational AI
  with Murf Falcon TTS, turns speech into tool calls on our /llm endpoint; the backend routes each edit to a tiered
  sub-agent (jnr-developer, snr-developer, architect) to balance latency
  and LLM cost, and streams every new version to a live preview.

model:
  preferred: "anthropic:claude-sonnet-5-5"
  fallback: ["openai:gpt-4.1", "google:gemini-2.5-pro"]

tools: [file-read, file-write]

skills: [route-intent, apply-edit]

voice:
  platform: agora-conversational-ai
  tts: murf-falcon
  prompt: agents/vox/SOUL.md
  llm_endpoint: /llm/{project_id}/chat/completions
  tools: backend/vox_tools.py

sub_agents:
  - name: code-editor
    path: agents/code-editor
    description: >
      Edit orchestrator. Delegates to jnr-developer, snr-developer,
      or architect based on intent-router tier assignment.
    sub_agents: [jnr-developer, snr-developer, architect]

delegation:
  mode: auto
