# Render blueprint: New + > Blueprint > pick this repo.
# Secrets marked sync: false are asked for once in the Render dashboard.
services:
  - type: web
    name: vox-build
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false
      - key: MURF_API_KEY
        sync: false
      - key: MURF_VOICE_ID
        value: Priya
      - key: MURF_LOCALE
        value: en-IN
      - key: ASR_LANGUAGE
        value: en-US
      - key: TOOL_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: TOOL_SYNC_WAIT
        value: "8"
